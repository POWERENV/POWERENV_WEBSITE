<body>
    <section id="hardware" class="view">
        <div class="grid">
            <div class="card col-span-12">
                <div class="card-header">
                    <h3 style="margin:0 0 12px 0">Recent Activity (Highlights)</h3>
                    <button class="btn" onclick="openEventsSection(event)">View full event activity</button>
                </div>

                <div style="max-height: 230px; overflow: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Event ID</th>
                                <th>Severity Level</th>
                                <th>Event Title</th>
                                <th>Event Description</th>
                                <th>Event Trigger Timestamp</th>
                                <th>Event Target Username</th>
                                <th>Event Acknowledgement Date</th>
                                <th>Event Resolved Date</th>
                            </tr>
                        </thead>
                        <tbody id="RecentActivityTableContent"></tbody>
                    </table>
                    <p id="emptyHardwareActivityListMessage" style="text-align: center; padding: 20px; color: var(--warning);">EMPTY LIST</p>
                </div>
            </div>
            <div class="card col-span-12" style="margin-top:8px">
                <div class="card-header">
                    <h3 style="margin:0 0 12px 0">PGrids</h3>
                    <button class="btn" onclick="addHardware()">+ Create PGrid</button>
                </div>
                <p class="muted small">Select a Power Grid from the list below to view details.</p>
                <div id="device-details" style="margin-top:14px">
                    <em id="pgridsNoDeviceSelectedWarning" class="muted">No device selected.</em>
                </div>
                <div id="pgridsListTileGrid" class="tiled-grid"></div>
            </div>
        </div>
    </section>
</body>
